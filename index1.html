<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz Cumpleaños Chino</title>
    <style>
        body {
            background-color: #0d1117;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .terminal {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 20px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .header {
            border-bottom: 1px solid #30363d;
            padding-bottom: 10px;
            margin-bottom: 20px;
            color: #8b949e;
            font-size: 0.9em;
        }
        #output {
            line-height: 1.6;
            white-space: pre-wrap;
            font-size: 1.1em;
        }
        .cursor {
            display: inline-block;
            width: 10px;
            height: 1.2em;
            background-color: #00ff00;
            vertical-align: text-bottom;
            animation: blink 1s step-end infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="terminal">
        <div class="header">bash - root@servidor-familiar:~</div>
        <div id="output"></div><span class="cursor"></span>
    </div>

    <script>
        // Aquí puedes editar tu mensaje
        const lines = [
            "> Iniciando protocolo de cumpleaños...",
            "> Escaneando objetivo...",
            "> Target localizado: Benjamín (a.k.a. 'Chino')",
            "> Validando estatus: Amigo [OK] | Cuñado [OK]",
            "> Desencriptando mensaje...",
            "",
            "¡Feliz cumpleaños, Chino! 🎂🍻",
            "Espero que te la pases increíble hoy.",
            "Un abrazo fuerte de parte de Adrián.",
            "",
            "> Sistema cerrado. Presiona cualquier tecla para festejar."
        ];

        const output = document.getElementById('output');
        let lineIndex = 0;
        let charIndex = 0;

        function typeWriter() {
            if (lineIndex < lines.length) {
                if (charIndex < lines[lineIndex].length) {
                    output.innerHTML += lines[lineIndex].charAt(charIndex);
                    charIndex++;
                    setTimeout(typeWriter, 40); // Velocidad de tipeado por letra
                } else {
                    output.innerHTML += "<br>";
                    lineIndex++;
                    charIndex = 0;
                    setTimeout(typeWriter, 500); // Pausa entre cada línea
                }
            }
        }

        setTimeout(typeWriter, 1000); // Retraso antes de empezar
    </script>
</body>
</html>
